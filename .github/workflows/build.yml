name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Cross-compile kidui
    needs: tests
    runs-on: ubuntu-latest
    container:
      image: aemiii91/miyoomini-toolchain@sha256:e5123590ad75d27f0f4c91196e3119a255cad45f3ae15243e29a8e0a2ec50132
      options: --user root
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
      - name: Checkout Onion (pinned)
        uses: actions/checkout@v4
        with:
          repository: OnionUI/Onion
          ref: 07505ea58c7bba698d6b9220ff43946a43cac76b
          path: onion
      - name: Build
        shell: bash
        run: |
          source /root/.bashrc
          source_hash=$(python3 tools/source_hash.py | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha256"])')
          cp -r src/kidsMode onion/src/
          cd onion/src/kidsMode
          make KIDS_BUILD_SOURCE="$source_hash"
          file kidui
          cp kidui "$GITHUB_WORKSPACE/App/KidsMode/bin/kidui"
      # kidui links Onion's on-screen keyboard (libkbinput) for child-name
      # entry. Kids Mode installs as a standalone app rather than into an
      # Onion build, so it can't ship Onion's lib directory — libkbinput.so
      # has to resolve on the device from the LD_LIBRARY_PATH runtime.sh
      # exports, which covers .tmp_update/lib, where Onion's root Makefile
      # copies lib/. on install. kidui already depends on libSDL_rotozoom.so
      # from that same directory, so the keyboard rides on an arrangement
      # that has been working since v1. Assert the dependency is really
      # there: a toolchain that quietly dropped it would ship a launcher
      # whose "Add another kid" row crashes on a parent's device.
      - name: Assert kidui links the on-screen keyboard
        shell: bash
        run: |
          source /root/.bashrc
          cd onion/src/kidsMode
          dyn=$("${CROSS_COMPILE}readelf" -d kidui)
          echo "$dyn" | grep -E 'NEEDED|PATH'
          echo "$dyn" | grep -q 'NEEDED.*libkbinput\.so' || {
            echo "::error::kidui does not link libkbinput.so"; exit 1; }
      - name: Commit the rebuilt binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          if git diff --quiet -- App/KidsMode/bin/kidui; then
            echo "bin/kidui already matches the source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App/KidsMode/bin/kidui
          # [skip ci] so this commit doesn't trigger another build; the actor
          # guard above is the backstop if that keyword ever stops working
          git commit -m "CI: rebuild bin/kidui from source [skip ci]"
          git push origin HEAD:main
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: KidsMode-app
          path: App
          if-no-files-found: error

  tests:
    name: Focused safety checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install small test toolset
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang busybox-static shellcheck
      - name: Lint workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Policy, recovery, sanitizer and fuzz checks
        env:
          CHECK_REPORT: ${{ runner.temp }}/kids-checks.json
          CHECK_MODE: ${{ startsWith(github.ref, 'refs/tags/v') && 'candidate' || 'full' }}
        run: sh tests/check.sh "$CHECK_MODE"
      - uses: actions/upload-artifact@v4
        with:
          name: KidsMode-checks
          path: ${{ runner.temp }}/kids-checks.json
          if-no-files-found: error

  release:
    name: Package release zip
    needs: [build, tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KidsMode-app
          path: dist/built-app
      - uses: actions/download-artifact@v4
        with:
          name: KidsMode-checks
          path: dist/checked
      - name: Assemble zip
        run: |
          python3 tools/package.py --binary dist/built-app/KidsMode/bin/kidui --checks dist/checked/kids-checks.json
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          name: Kids Mode ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
            dist/*.json
